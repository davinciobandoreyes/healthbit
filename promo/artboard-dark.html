<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>HealthBit — Promo dark 1920×1080</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0f172a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #artboard {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 900px 700px at 88% 12%, rgba(124, 58, 237, 0.38), transparent 62%),
        radial-gradient(ellipse 700px 560px at 70% 100%, rgba(79, 70, 229, 0.22), transparent 68%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 52%, #2e1065 100%);
    }

    .copy {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 1080px;
      padding: 80px 24px 68px 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(to top right, #7c3aed, #818cf8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -8px rgba(124, 58, 237, 0.7);
    }

    .wordmark {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
      line-height: 1;
    }

    .wordmark span { color: #c4b5fd; }

    .headline h1 {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.08;
      color: #fff;
    }

    .headline p {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: -0.01em;
      max-width: 420px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
    }

    .chip svg { color: #c4b5fd; }

    .footer {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stage {
      position: absolute;
      left: 500px;
      top: 0;
      width: 1420px;
      height: 1080px;
    }

    .shot {
      position: absolute;
      background: #fff;
      overflow: hidden;
    }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .desktop {
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 0 0 1px rgba(124, 58, 237, 0.18),
        0 32px 64px -16px rgba(0, 0, 0, 0.55);
    }

    .directory {
      width: 740px;
      top: 40px;
      right: 28px;
      transform: rotate(7deg);
      z-index: 1;
    }

    .dashboard {
      width: 880px;
      top: 280px;
      right: 88px;
      transform: rotate(-3.5deg);
      z-index: 2;
    }

    .phone {
      width: 248px;
      bottom: 56px;
      left: 48px;
      z-index: 3;
      transform: rotate(-8deg);
      padding: 9px 8px 12px;
      border-radius: 34px;
      background: #020617;
      border: 1px solid #334155;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.1) inset,
        0 0 40px rgba(124, 58, 237, 0.28),
        0 30px 50px -16px rgba(0, 0, 0, 0.6);
    }

    .phone .notch {
      width: 72px;
      height: 6px;
      border-radius: 999px;
      background: #334155;
      margin: 0 auto 7px;
    }

    .phone .screen {
      border-radius: 22px;
      overflow: hidden;
      background: #f8fafc;
    }

    .phone img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="artboard">
    <aside class="copy">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="wordmark">Health<span>Bit</span></div>
      </div>

      <div class="headline">
        <h1>Médicos verificados.<br />Confianza real.</h1>
        <p>Especialistas con RETHUS revisado.</p>
        <div class="chips">
          <span class="chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            RETHUS
          </span>
          <span class="chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Biometría
          </span>
          <span class="chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Directorio
          </span>
        </div>
      </div>

      <p class="footer">Colombia</p>
    </aside>

    <div class="stage">
      <div class="shot desktop directory">
        <img src="screens/directory.png" alt="Directorio de médicos HealthBit" />
      </div>
      <div class="shot desktop dashboard">
        <img src="screens/dashboard.png" alt="Portal médico HealthBit" />
      </div>
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <img src="screens/mobile.png" alt="Registro y validación biométrica" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
